<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <title>PassTheAux - Live DJ Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e293b;
    }

    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>

<body>
  <div id="root">
    <style>
      .initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0f172a;
        color: #f8fafc;
        flex-direction: column;
        font-family: 'Inter', sans-serif;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #334155;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="initial-loader">
      <div class="spinner"></div>
      <p>Loading PassTheAux...</p>
    </div>
  </div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      console.error("Global Error:", message, error);
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
            <div style="padding: 20px; color: #ef4444; background: #0f172a; height: 100vh; font-family: sans-serif;">
              <h1>Something went wrong</h1>
              <p>${message}</p>
              <button onclick="window.location.reload()" style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
                Reload Application
              </button>
            </div>
           `;
      }
    };
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
